<a sa="fade-up" [routerLink]="['/produit', product.id]" class="block bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition-all duration-300 group">
  <div class="relative aspect-[4/3] overflow-hidden">
    <img [src]="product.image" [alt]="product.name + ' pour ' + product.brand + ' ' + product.model" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" (error)="onImgError($event)" />
    <div class="absolute top-2 left-2">
      <span class="px-2 py-1 text-[10px] md:text-xs font-bold rounded-lg shadow-sm backdrop-blur-md" [ngClass]="availabilityClass(product.availability)">
        {{ product.availability }}
      </span>
    </div>
  </div>
  <div class="p-3 md:p-4">
    <h3 class="text-sm md:text-lg font-bold text-[#1F3A5F] mb-1 truncate group-hover:text-[#4cb0ff] transition-colors">{{ product.name }}</h3>
    <p class="text-[10px] md:text-sm text-gray-500 mb-3 truncate font-medium">{{ product.brand }} {{ product.model }} • {{ product.year }}</p>
    <div class="mt-auto pt-3 border-t border-gray-50">
      <!-- Layout pour les produits avec PRIX -->
      <div *ngIf="product.price > 0" class="flex items-center justify-between gap-2">
        <span class="font-black text-[#1F3A5F] text-sm md:text-xl whitespace-nowrap">
          {{ product.price }} DT
        </span>
        <button
          (click)="addToCart($event)"
          [disabled]="product.availability === 'Rupture'"
          class="bg-[#1F3A5F] text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-[10px] md:text-sm font-bold hover:bg-[#2d5080] active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap flex-shrink-0 shadow-sm"
        >
          Ajouter
        </button>
      </div>

      <!-- Layout optimisé pour SUR COMMANDE (Mobile Friendly) -->
      <div *ngIf="product.price === 0" class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <span class="text-[10px] md:text-xs font-black uppercase text-gray-400 tracking-wider">
          Sur commande
        </span>
        <a
          href="https://wa.me/21600000000?text=Bonjour, je souhaite commander le produit : {{ product.name }} ({{ product.brand }} {{ product.model }} - {{ product.year }})"
          target="_blank"
          (click)="$event.stopPropagation()"
          class="bg-[#25D366] text-white px-3 py-2 rounded-lg text-[10px] md:text-xs font-bold hover:bg-[#128C7E] active:scale-95 transition-all whitespace-nowrap flex items-center justify-center gap-1.5 shadow-sm w-full sm:w-auto"
        >
          <svg class="w-3.5 h-3.5 md:w-4 md:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Commander
        </a>
      </div>
    </div>
  </div>
</a>
